version: "3.8"

services:
  web:
    build: .
    container_name: tulahack-back-26
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CORS_SETTINGS__ALLOWEDORIGINS__0=http://localhost:3000
      - CORS_SETTINGS__ALLOWEDORIGINS__1=http://localhost:5173
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - postgres
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=hackaton
  pg_admin:
    image: dpage/pgadmin4:latest
    container_name: tulahack-pgadmin-26
    environment:
      - PGADMIN_DEFAULT_EMAIL=vadim130809@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=root
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres:
